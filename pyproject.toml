[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "pyrealtime-ai"
version = "0.2.1"
description = "Client-neutral Python backend toolkit for authenticated chat and OpenAI Realtime applications."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Simple Desenvolvedores" }]
license = { file = "LICENSE" }
keywords = ["openai", "realtime", "webrtc", "fastapi", "voice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.scripts]
pyrealtime-example = "pyrealtime.example_app:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
files = [
  "Pillow>=11,<13",
  "pypdf>=5,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
]
auth = [
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "twine>=6,<8",
]

[project.urls]
Documentation = "https://github.com/GlaucoDutra/pyrealtime/blob/main/docs/LLM_USAGE.md"
Issues = "https://github.com/GlaucoDutra/pyrealtime/issues"
Repository = "https://github.com/GlaucoDutra/pyrealtime"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrealtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
