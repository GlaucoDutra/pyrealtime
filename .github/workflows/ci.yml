name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[api,auth,dev,files]"
      - run: python -m pytest
      - if: matrix.python-version == '3.13'
        run: python -m build && python -m twine check dist/*
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  clean-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv .consumer
          WHEEL=$(find dist -name '*.whl' -print -quit)
          .consumer/bin/python -m pip install "${WHEEL}[api,auth]"
          .consumer/bin/pyrealtime --version
          .consumer/bin/pyrealtime doctor --no-network
          .consumer/bin/python tests/consumer_check.py
      - run: python -m zipfile -l dist/*.whl
      - run: tar -tzf dist/*.tar.gz
